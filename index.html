<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="حرب الدبابات">
  <meta name="theme-color" content="#14160f">
  <title>حرب الدبابات</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root { --ground: #14160f; --panel: #1d2016; --line: #3b412f; --sand: #e6c35c; --text: #ece8d8; --muted: #b3b09a; --alert: #eb5242; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--ground); color: var(--text);
      font-family: "Segoe UI", Tahoma, "Geeza Pro", "Noto Sans Arabic", sans-serif; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    /* the game fills the whole window, whatever its shape */
    #game-root { position: fixed; inset: 0; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--ground); outline: none; }
    .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
      padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); box-sizing: border-box; }
    #boot { background: repeating-linear-gradient(135deg, transparent 0 22px, rgba(230,195,92,0.035) 22px 44px), var(--ground); z-index: 5; transition: opacity .5s ease; }
    #boot.done { opacity: 0; pointer-events: none; }
    .card { width: min(460px, 100%); display: grid; gap: 16px; text-align: center; }
    .logo { width: min(420px, 92%); height: auto; margin: 0 auto; display: block; }
    .sub { margin: 0; color: var(--muted); }
    .gauge { position: relative; height: 14px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); overflow: hidden; }
    .gauge > span { position: absolute; inset: 0 auto 0 0; width: 0%; background: repeating-linear-gradient(90deg, var(--sand) 0 10px, #c9a845 10px 12px); transition: width .2s ease; }
    #status { color: var(--muted); font-size: .95rem; }
    #err { display: none; margin: 0; padding: 12px 14px; border: 1px solid var(--alert); border-radius: 4px; background: rgba(235,82,66,.12);
      text-align: start; font-size: .9rem; line-height: 1.6; word-break: break-word; }
    .tip { margin: 0; color: var(--muted); font-size: .85rem; line-height: 1.7; }
    #iostip { display: none; }
    /* phones held upright: ask to turn sideways (the battlefield needs the width) */
    #rotate { display: none; z-index: 8; background: rgba(20,22,15,.96); flex-direction: column; gap: 18px; text-align: center; }
    #rotate .phone { width: 46px; height: 78px; border: 4px solid var(--sand); border-radius: 9px; animation: turn 2.2s ease-in-out infinite; }
    @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    #rotate button { font: inherit; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 4px; padding: 8px 16px; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate.on { display: flex; } }
    @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } .gauge > span, #boot { transition: none; } }
  </style>
</head>
<body>
  <div id="game-root"><canvas id="unity-canvas" tabindex="-1"></canvas></div>

  <div id="boot" class="screen" role="status" aria-live="polite">
    <div class="card">
      <img class="logo" src="logo.png" alt="حرب الدبابات - Tank War">
      <p class="sub" id="sub">معركة على الرمل مع الكمبيوتر أو مع أصحابك</p>
      <div class="gauge" aria-hidden="true"><span id="bar"></span></div>
      <div id="status">بنحمّل اللعبة…</div>
      <p id="err"></p>
      <p class="tip" id="iostip">على الآيفون: عشان تلعب بشاشة كاملة، دوس زرار المشاركة في سفاري واختار «إضافة إلى الشاشة الرئيسية»، وافتح اللعبة من الأيقونة.</p>
    </div>
  </div>

  <div id="rotate" class="screen on">
    <div class="phone" aria-hidden="true"></div>
    <div id="rotate-text">لف الموبايل بالعرض عشان تلعب</div>
    <button type="button" id="rotate-skip">كمّل كده</button>
  </div>

  <script>
    // Arabic or English: the language picked in the game last time, otherwise the browser's own
    var EN = (function () {
      try { var s = localStorage.getItem("tw.lang"); if (s) return s === "en"; } catch (e) { }
      return !/^ar/i.test(navigator.language || "");
    })();
    function T(ar, en) { return EN ? en : ar; }
    if (EN) {
      document.documentElement.lang = "en"; document.documentElement.dir = "ltr";
      document.getElementById("sub").textContent = "Battle on the sand against the computer or your friends";
      document.getElementById("status").textContent = "Loading the game…";
      document.getElementById("iostip").textContent = "On iPhone: to play full screen, tap Share in Safari, choose “Add to Home Screen” and open the game from its icon.";
      document.getElementById("rotate-text").textContent = "Turn your phone sideways to play";
      document.getElementById("rotate-skip").textContent = "Continue anyway";
    }
    var canvas = document.getElementById("unity-canvas");
    var bar = document.getElementById("bar");
    var statusEl = document.getElementById("status");
    var errEl = document.getElementById("err");
    var started = false;

    var ua = navigator.userAgent || "";
    var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isMobile = isIOS || /Android|Mobile/i.test(ua);
    var standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches || window.matchMedia("(display-mode: fullscreen)").matches;
    if (isIOS && !standalone && !(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen))
      document.getElementById("iostip").style.display = "block";

    document.getElementById("rotate-skip").addEventListener("click", function () { document.getElementById("rotate").classList.remove("on"); });

    function fail(message) {
      statusEl.textContent = T("اللعبة ما اشتغلتش على الجهاز ده", "The game could not start on this device");
      errEl.style.display = "block";
      errEl.textContent = message;
    }

    // until the game is running, show any script error instead of a silent black screen
    // Errors from outside the game (a browser extension, the page translator) arrive as a bare
    // "Script error." or from another site's file. Unity's loader would abort the start-up on them,
    // so they are stopped here, before the loader's own listener sees them.
    function foreign(e) {
      var f = e.filename || "";
      if (!f) return /^script error\.?$/i.test((e.message || "").trim());
      return f.indexOf(location.origin) !== 0 && f.indexOf("blob:" + location.origin) !== 0;
    }
    window.addEventListener("error", function (e) {
      if (e.target && e.target !== window) return; // a missing image or file, handled where it loads
      if (foreign(e)) { e.stopImmediatePropagation(); e.preventDefault(); return; }
      if (!started) fail(T("خطأ: ", "Error: ") + (e.message || e));
    }, true);
    window.addEventListener("unhandledrejection", function (e) { if (!started) fail(T("خطأ: ", "Error: ") + ((e.reason && e.reason.message) || e.reason)); });

    function hasWebGL2() {
      try { var c = document.createElement("canvas"); return !!c.getContext("webgl2"); } catch (e) { return false; }
    }

    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/32ee3a2eff24b88bb226d5712352875f.data.unityweb",
      frameworkUrl: buildUrl + "/e4671ab523d9b889cd53dad9aeae653c.framework.js.unityweb",
      fullscreenElementID: "game-root",
      codeUrl: buildUrl + "/1456268ea149ad143b90fe8896237044.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "حرب الدبابات",
      productVersion: "4.0.1",
      matchWebGLToCanvasSize: true,
      // phone screens pack 3x the pixels; rendering at up to 1.5x looks the same at arm's length and runs far cooler
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2),
      showBanner: function (msg, type) { if (type === "error") fail(msg); else console.warn(msg); }
    };

    if (!hasWebGL2()) {
      fail(T("المتصفح ده مش بيدعم WebGL 2. جرّب آخر إصدار من كروم أو سفاري أو إيدج أو فايرفوكس. على الآيفون والآيباد لازم iOS 15 أو أحدث.", "This browser does not support WebGL 2. Try the latest Chrome, Safari, Edge or Firefox. iPhone and iPad need iOS 15 or later."));
    } else {
      var script = document.createElement("script");
      script.src = buildUrl + "/a5c54c7afac7b6d7d78721672f1a990b.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          bar.style.width = Math.round(p * 100) + "%";
          statusEl.textContent = p < 0.9 ? T("بنحمّل اللعبة… ", "Loading the game… ") + Math.round(p * 100) + T("٪", "%") : T("بنجهّز المعركة…", "Preparing the battle…");
        }).then(function () {
          started = true;
          bar.style.width = "100%";
          document.getElementById("boot").classList.add("done");
          canvas.focus();
        }).catch(function (e) { fail(T("حصلت مشكلة وإحنا بنشغّل اللعبة: ", "Something went wrong starting the game: ") + ((e && e.message) || e)); });
      };
      script.onerror = function () { fail(T("تعذّر تحميل ملف التشغيل. اتأكد إن كل الملفات اترفعت (فولدر Build).", "Could not load the game file. Make sure every file was uploaded (the Build folder).")); };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
